version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "my-angular-image"        # Your ECR repository name
    IMAGE_TAG: "latest"

phases:
  install:
    runtime-versions:
      nodejs: 20
      docker: 24
    commands:
      - echo Installing dependencies...
      - npm install -g @angular/cli

  pre_build:
    commands:
      - echo Logging into AWS ECR...
      - aws --version
      - $(aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com)
      - echo Installing project dependencies...
      - npm install

  build:
    commands:
      - echo Building Angular application...
      - ng build --configuration production
      - echo Building Docker image...
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .

  post_build:
    commands:
      - echo Tagging Docker image...
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo Pushing image to ECR...
      - docker push $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo Build completed successfully!

artifacts:
  files:
    - '**/*'
  base-directory: dist
